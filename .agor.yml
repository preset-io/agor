environment:
  default: sqlite
  variants:
    ha:
      start: >-
        env HA_PORT={{add 3000 branch.unique_id}} HA_DAEMON_A_PORT={{add 13000 branch.unique_id}} HA_DAEMON_B_PORT={{add 14000 branch.unique_id}}
        AGOR_HA_PUBLIC_ORIGIN=http://{{host.ip_address}}:{{add 3000 branch.unique_id}}
        AGOR_REDIS_KEY_PREFIX=agor-ha-{{branch.unique_id}}
        AGOR_JWT_SECRET=agor-ha-dev-jwt-secret-00000000000000000000000000000000
        AGOR_MASTER_SECRET=agor-ha-dev-master-secret-000000000000000000000000000000
        AGOR_ADMIN_PASSWORD=admin
        AGOR_ALLOW_DEVELOPMENT_DEFAULT_ADMIN=true AGOR_HA_NODE_ENV=development
        docker compose -f docker-compose.ha.yml -p agor-ha-{{branch.name}} up -d --build
      stop: >-
        env AGOR_HA_PUBLIC_ORIGIN=http://{{host.ip_address}}:{{add 3000 branch.unique_id}}
        AGOR_REDIS_KEY_PREFIX=agor-ha-{{branch.unique_id}}
        AGOR_JWT_SECRET=agor-ha-dev-jwt-secret-00000000000000000000000000000000
        AGOR_MASTER_SECRET=agor-ha-dev-master-secret-000000000000000000000000000000
        AGOR_ADMIN_PASSWORD=admin
        AGOR_ALLOW_DEVELOPMENT_DEFAULT_ADMIN=true AGOR_HA_NODE_ENV=development
        docker compose -f docker-compose.ha.yml -p agor-ha-{{branch.name}} down
      nuke: >-
        env AGOR_HA_PUBLIC_ORIGIN=http://{{host.ip_address}}:{{add 3000 branch.unique_id}}
        AGOR_REDIS_KEY_PREFIX=agor-ha-{{branch.unique_id}}
        AGOR_JWT_SECRET=agor-ha-dev-jwt-secret-00000000000000000000000000000000
        AGOR_MASTER_SECRET=agor-ha-dev-master-secret-000000000000000000000000000000
        AGOR_ADMIN_PASSWORD=admin
        AGOR_ALLOW_DEVELOPMENT_DEFAULT_ADMIN=true AGOR_HA_NODE_ENV=development
        docker compose -f docker-compose.ha.yml -p agor-ha-{{branch.name}} down -v --remove-orphans
      logs: >-
        env AGOR_HA_PUBLIC_ORIGIN=http://{{host.ip_address}}:{{add 3000 branch.unique_id}}
        AGOR_REDIS_KEY_PREFIX=agor-ha-{{branch.unique_id}}
        AGOR_JWT_SECRET=agor-ha-dev-jwt-secret-00000000000000000000000000000000
        AGOR_MASTER_SECRET=agor-ha-dev-master-secret-000000000000000000000000000000
        AGOR_ADMIN_PASSWORD=admin
        AGOR_ALLOW_DEVELOPMENT_DEFAULT_ADMIN=true AGOR_HA_NODE_ENV=development
        docker compose -f docker-compose.ha.yml -p agor-ha-{{branch.name}} logs --tail=150
      description: >-
        Opt-in constrained active-active HA smoke topology: PostgreSQL, ephemeral Redis,
        explicit daemon-a and daemon-b identities, and nginx Engine.IO affinity. Audited durable
        workers and noninteractive Tasks run; process-affine flows fail closed. Inline values are
        isolated development-only secrets and admin@agor.live/admin; operators must supply stable
        managed secrets and strong bootstrap credentials.
      health: http://localhost:{{add 3000 branch.unique_id}}/readyz
      app: http://{{host.ip_address}}:{{add 3000 branch.unique_id}}
    docs:
      start: >-
        INSTANCE_LABEL={{branch.name}} PORT={{add 7000 branch.unique_id}} NEXT_PUBLIC_SITE_URL=http://{{host.ip_address}}:{{add
        7000 branch.unique_id}} docker compose -f apps/agor-docs/docker-compose.yml -p
        agor-docs-{{branch.name}} up -d --build
      stop: docker compose -f apps/agor-docs/docker-compose.yml -p agor-docs-{{branch.name}} down
      description: >-
        Nextra docs site (apps/agor-docs) for previewing documentation edits. Runs `next dev` in a
        self-contained Docker container — no daemon, no database, no host-side `pnpm install`
        needed. Port = {{add 7000 branch.unique_id}}; app URL uses {{host.ip_address}} so it's
        reachable from outside the daemon host.
      nuke: >-
        docker compose -f apps/agor-docs/docker-compose.yml -p agor-docs-{{branch.name}} down -v
        --rmi local
      logs: >-
        docker compose -f apps/agor-docs/docker-compose.yml -p agor-docs-{{branch.name}} logs
        --tail=100
      health: http://localhost:{{add 7000 branch.unique_id}}
      app: http://{{host.ip_address}}:{{add 7000 branch.unique_id}}
    full:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} SEED=true AGOR_RBAC_ENABLED=true AGOR_UNIX_USER_MODE=sandbox docker compose -f
        docker-compose.yml -f docker-compose.postgres.yml -p agor-{{branch.name}}
        --profile postgres up -d --build postgres agor-dev
      stop: >-
        docker compose -f docker-compose.yml -f docker-compose.postgres.yml -p
        agor-{{branch.name}} --profile postgres down
      description: >-
        Production-like: PostgreSQL + branch RBAC + fail-closed local bubblewrap filesystem
        isolation. No host accounts, Unix groups, or sudo impersonation.
      extends: sqlite
      nuke: >-
        docker compose -f docker-compose.yml -f docker-compose.postgres.yml -p
        agor-{{branch.name}} --profile postgres down -v
      logs: >-
        docker compose -f docker-compose.yml -f docker-compose.postgres.yml -p
        agor-{{branch.name}} --profile postgres logs --tail=100
    sqlite:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} SEED=true docker compose -p agor-{{branch.name}} up -d --build
      stop: docker compose -p agor-{{branch.name}} down
      description: Single-user dev with SQLite. No RBAC. Fastest to boot.
      nuke: docker compose -p agor-{{branch.name}} down -v
      logs: docker compose -p agor-{{branch.name}} logs --tail=100
      health: http://localhost:{{add 3000 branch.unique_id}}/health
      app: http://{{host.ip_address}}:{{add 5000 branch.unique_id}}
    sandbox:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} SEED=true AGOR_SANDBOX_ENABLED=true docker compose -p agor-{{branch.name}} up -d --build
      description: >-
        SQLite dev with the OS-level executor filesystem sandbox ENABLED
        (execution.sandbox.enabled via AGOR_SANDBOX_ENABLED=true). Every executor
        spawn is wrapped in raw bubblewrap (filesystem-only, shared network so the
        daemon/model stay reachable) at the single spawn chokepoint — tool-agnostic
        across Claude/Codex/Gemini/terminals. Branch + tmp writable; the base repo
        `.git` is bound for commits; ~/.agor secrets and sibling branches are hidden.
        Requires unprivileged user namespaces inside the container — the
        auto-loaded docker-compose.override.yml relaxes seccomp/apparmor for bwrap.
        See context/explorations/executor-sandboxing.md.
      extends: sqlite
    sandbox-peruser:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} SEED=true AGOR_UNIX_USER_MODE=sandbox docker compose -p agor-{{branch.name}} up -d --build
      description: >-
        PRODUCTION-ALIGNED sandbox isolation (unix_user_mode: sandbox). This one
        setting FORCES branch_rbac=true + sandbox.enabled=true +
        sandbox.home_mode=per_user + fail_if_unavailable=true (no OS impersonation).
        Each session gets a private, persistent home overlaid at the passwd home
        from <data_home>/tenants/<tenant>/homes/<owner_id> (or users.filesystem_home
        when set), the daemon .agor tree + other homes are hidden, and the branch is
        mounted rw/ro/none per the owner's RBAC fs_access. PID namespace is used
        where the host allows it (bare-metal) and skipped in containers. The
        No sudoers, host accounts, or POSIX branch groups. See
        context/explorations/executor-sandboxing.md.
      extends: sqlite
    postgres:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} SEED=true docker compose -f docker-compose.yml -f
        docker-compose.override.postgres.yml -p agor-{{branch.name}} --profile postgres up -d
        --build postgres agor-dev
      stop: >-
        docker compose -f docker-compose.yml -f docker-compose.override.postgres.yml -p
        agor-{{branch.name}} --profile postgres down
      description: Dev with PostgreSQL. RBAC off. Closer to multi-user prod layout.
      extends: sqlite
      nuke: >-
        docker compose -f docker-compose.yml -f docker-compose.override.postgres.yml -p
        agor-{{branch.name}} --profile postgres down -v
      logs: >-
        docker compose -f docker-compose.yml -f docker-compose.override.postgres.yml -p
        agor-{{branch.name}} --profile postgres logs --tail=100
    sqlite-demo:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} SEED=true LOAD_FIXTURES=true docker compose -p agor-{{branch.name}} up -d --build
      description: >-
        SQLite dev + demo fixtures (SEED + LOAD_FIXTURES): boots a populated demo board with 4
        loginable demo users (demo.alice@agor.live / demo-password-alice, …) for instant E2E
        testing. Dev-only.
      extends: sqlite
    postgres-demo:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} SEED=true LOAD_FIXTURES=true docker compose -f docker-compose.yml -f
        docker-compose.override.postgres.yml -p agor-{{branch.name}} --profile postgres up -d
        --build postgres agor-dev
      stop: >-
        docker compose -f docker-compose.yml -f docker-compose.override.postgres.yml -p
        agor-{{branch.name}} --profile postgres down
      description: >-
        PostgreSQL dev + demo fixtures (SEED + LOAD_FIXTURES): boots a populated demo board with 4
        loginable demo users (demo.alice@agor.live / demo-password-alice, …) on a Postgres backend
        for instant E2E testing. Dev-only.
      extends: sqlite
      nuke: >-
        docker compose -f docker-compose.yml -f docker-compose.override.postgres.yml -p
        agor-{{branch.name}} --profile postgres down -v
      logs: >-
        docker compose -f docker-compose.yml -f docker-compose.override.postgres.yml -p
        agor-{{branch.name}} --profile postgres logs --tail=100
