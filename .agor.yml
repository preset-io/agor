environment:
  default: sqlite
  variants:
    ha:
      start: >-
        env HA_PORT={{add 3000 branch.unique_id}} HA_DAEMON_A_PORT={{add 13000 branch.unique_id}} HA_DAEMON_B_PORT={{add 14000 branch.unique_id}}
        AGOR_HA_PUBLIC_ORIGIN=http://{{host.ip_address}}:{{add 3000 branch.unique_id}}
        AGOR_REDIS_KEY_PREFIX=agor-ha-{{branch.unique_id}}
        AGOR_JWT_SECRET=agor-ha-dev-jwt-secret-00000000000000000000000000000000
        AGOR_MASTER_SECRET=agor-ha-dev-master-secret-000000000000000000000000000000
        AGOR_EXTERNAL_LAUNCH_SHARED_SECRET=agor-ha-dev-launch-secret-000000000000000000000000
        AGOR_HA_NODE_ENV=development
        docker compose -f docker-compose.ha.yml -p agor-ha-{{branch.name}} up -d --build
      stop: >-
        env AGOR_HA_PUBLIC_ORIGIN=http://{{host.ip_address}}:{{add 3000 branch.unique_id}}
        AGOR_REDIS_KEY_PREFIX=agor-ha-{{branch.unique_id}}
        AGOR_JWT_SECRET=agor-ha-dev-jwt-secret-00000000000000000000000000000000
        AGOR_MASTER_SECRET=agor-ha-dev-master-secret-000000000000000000000000000000
        AGOR_EXTERNAL_LAUNCH_SHARED_SECRET=agor-ha-dev-launch-secret-000000000000000000000000
        AGOR_HA_NODE_ENV=development
        docker compose -f docker-compose.ha.yml -p agor-ha-{{branch.name}} down
      nuke: >-
        env AGOR_HA_PUBLIC_ORIGIN=http://{{host.ip_address}}:{{add 3000 branch.unique_id}}
        AGOR_REDIS_KEY_PREFIX=agor-ha-{{branch.unique_id}}
        AGOR_JWT_SECRET=agor-ha-dev-jwt-secret-00000000000000000000000000000000
        AGOR_MASTER_SECRET=agor-ha-dev-master-secret-000000000000000000000000000000
        AGOR_EXTERNAL_LAUNCH_SHARED_SECRET=agor-ha-dev-launch-secret-000000000000000000000000
        AGOR_HA_NODE_ENV=development
        docker compose -f docker-compose.ha.yml -p agor-ha-{{branch.name}} down -v --remove-orphans
      logs: >-
        env AGOR_HA_PUBLIC_ORIGIN=http://{{host.ip_address}}:{{add 3000 branch.unique_id}}
        AGOR_REDIS_KEY_PREFIX=agor-ha-{{branch.unique_id}}
        AGOR_JWT_SECRET=agor-ha-dev-jwt-secret-00000000000000000000000000000000
        AGOR_MASTER_SECRET=agor-ha-dev-master-secret-000000000000000000000000000000
        AGOR_EXTERNAL_LAUNCH_SHARED_SECRET=agor-ha-dev-launch-secret-000000000000000000000000
        AGOR_HA_NODE_ENV=development
        docker compose -f docker-compose.ha.yml -p agor-ha-{{branch.name}} logs --tail=150
      description: >-
        Hosted control-plane smoke: PostgreSQL/RLS, ephemeral Redis, two daemons, nginx affinity,
        auth-resolved tenants, RBAC, per-user sandbox homes, and a development identity picker.
      health: http://localhost:{{add 3000 branch.unique_id}}/readyz
      app: http://{{host.ip_address}}:{{add 3000 branch.unique_id}}/dev-auth/
    docs:
      start: >-
        INSTANCE_LABEL={{branch.name}} PORT={{add 7000 branch.unique_id}} NEXT_PUBLIC_SITE_URL=http://{{host.ip_address}}:{{add
        7000 branch.unique_id}} docker compose -f apps/agor-docs/docker-compose.yml -p
        agor-docs-{{branch.name}} up -d --build
      stop: docker compose -f apps/agor-docs/docker-compose.yml -p agor-docs-{{branch.name}} down
      description: >-
        Docs preview: Nextra dev server in Docker, with no daemon or database. Port
        {{add 7000 branch.unique_id}} on {{host.ip_address}}.
      nuke: >-
        docker compose -f apps/agor-docs/docker-compose.yml -p agor-docs-{{branch.name}} down -v
        --rmi local
      logs: >-
        docker compose -f apps/agor-docs/docker-compose.yml -p agor-docs-{{branch.name}} logs
        --tail=100
      health: http://localhost:{{add 7000 branch.unique_id}}
      app: http://{{host.ip_address}}:{{add 7000 branch.unique_id}}
    rich:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} AGOR_MIGRATION_OFFLINE_CUTOVER=true SEED=true AGOR_RBAC_ENABLED=true AGOR_UNIX_USER_MODE=sandbox docker compose -f
        docker-compose.yml -f docker-compose.postgres.yml -p agor-{{branch.name}}
        --profile postgres up -d --build postgres agor-dev
      stop: >-
        docker compose -f docker-compose.yml -f docker-compose.postgres.yml -p
        agor-{{branch.name}} --profile postgres down
      description: >-
        PostgreSQL + branch RBAC + fail-closed per-user sandbox + per-branch SDK homes, with
        Alice/Bob fixtures. Standalone development only; HA remains a separate variant.
      nuke: >-
        docker compose -f docker-compose.yml -f docker-compose.postgres.yml -p
        agor-{{branch.name}} --profile postgres down -v
      logs: >-
        docker compose -f docker-compose.yml -f docker-compose.postgres.yml -p
        agor-{{branch.name}} --profile postgres logs --tail=100
      health: http://localhost:{{add 3000 branch.unique_id}}/health
      app: http://{{host.ip_address}}:{{add 5000 branch.unique_id}}
    full:
      description: Deprecated compatibility alias for `rich`; use `rich` for new branches.
      extends: rich
    sqlite:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} AGOR_MIGRATION_OFFLINE_CUTOVER=true SEED=true docker compose -p agor-{{branch.name}} up -d --build
      stop: docker compose -p agor-{{branch.name}} down
      description: SQLite standalone dev; RBAC and executor sandbox off. Fastest to boot.
      nuke: docker compose -p agor-{{branch.name}} down -v
      logs: docker compose -p agor-{{branch.name}} logs --tail=100
      health: http://localhost:{{add 3000 branch.unique_id}}/health
      app: http://{{host.ip_address}}:{{add 5000 branch.unique_id}}
    codespaces-sqlite:
      startup_timeout_ms: 1500000
      start: >-
        node scripts/managed-environments/codespaces/agor-codespace-launcher.mjs start
        --repository {{shellQuote repo.github_slug}} --ref {{shellQuote branch.ref}}
        --binding {{shellQuote branch.id}}
        --devcontainer-path .devcontainer/agor-managed/devcontainer.json
        --idle-timeout-minutes 30 --retention-period-minutes 1440
        --wait-seconds 1200
        --app-port 5000 --health-port 3000 --health-path /health
        --port-visibility public --emit-health public-only
      stop: >-
        node scripts/managed-environments/codespaces/agor-codespace-launcher.mjs stop
        --repository {{shellQuote repo.github_slug}} --ref {{shellQuote branch.ref}}
        --binding {{shellQuote branch.id}}
        --wait-seconds 1200
      sync: >-
        node scripts/managed-environments/codespaces/agor-codespace-launcher.mjs sync
        --repository {{shellQuote repo.github_slug}} --ref {{shellQuote branch.ref}}
        --binding {{shellQuote branch.id}} --revision {{shellQuote sync.revision}}
        --wait-seconds 1200
      nuke: >-
        node scripts/managed-environments/codespaces/agor-codespace-launcher.mjs nuke
        --repository {{shellQuote repo.github_slug}} --ref {{shellQuote branch.ref}}
        --binding {{shellQuote branch.id}}
        --wait-seconds 1200
      logs: >-
        node scripts/managed-environments/codespaces/agor-codespace-launcher.mjs logs
        --repository {{shellQuote repo.github_slug}} --ref {{shellQuote branch.ref}}
        --binding {{shellQuote branch.id}}
      app: https://github.com/codespaces
      description: >-
        EXPERIMENTAL, opt-in, single-GitHub-actor Codespaces preview. The remote Agor daemon uses
        SQLite; ports 3000/5000 are deliberately public after readiness, subject to GitHub policy.
        Requires gh Codespaces access and a pushed branch ref. Not for Cloud/HA or production use.
    sandbox:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} AGOR_MIGRATION_OFFLINE_CUTOVER=true SEED=true AGOR_SANDBOX_ENABLED=true docker compose -p agor-{{branch.name}} up -d --build
      description: >-
        SQLite + tunable shared-home bubblewrap sandbox. RBAC off; falls back to unsandboxed
        execution if bubblewrap is unavailable.
      extends: sqlite
    sandbox-peruser:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} AGOR_MIGRATION_OFFLINE_CUTOVER=true SEED=true AGOR_UNIX_USER_MODE=sandbox docker compose -p agor-{{branch.name}} up -d --build
      description: >-
        SQLite + fail-closed per-user bubblewrap sandbox. Forces branch RBAC and uses RBAC-derived
        branch mounts; no host-user impersonation.
      extends: sqlite
    postgres:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} AGOR_MIGRATION_OFFLINE_CUTOVER=true SEED=true docker compose -f docker-compose.yml -f
        docker-compose.override.postgres.yml -p agor-{{branch.name}} --profile postgres up -d
        --build postgres agor-dev
      stop: >-
        docker compose -f docker-compose.yml -f docker-compose.override.postgres.yml -p
        agor-{{branch.name}} --profile postgres down
      description: >-
        PostgreSQL standalone dev for schema and RLS parity; RBAC and executor sandbox off.
      extends: sqlite
      nuke: >-
        docker compose -f docker-compose.yml -f docker-compose.override.postgres.yml -p
        agor-{{branch.name}} --profile postgres down -v
      logs: >-
        docker compose -f docker-compose.yml -f docker-compose.override.postgres.yml -p
        agor-{{branch.name}} --profile postgres logs --tail=100
    sqlite-demo:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} AGOR_MIGRATION_OFFLINE_CUTOVER=true SEED=true LOAD_FIXTURES=true docker compose -p agor-{{branch.name}} up -d --build
      description: >-
        SQLite + development seed + four-user demo fixtures. Development only.
      extends: sqlite
    postgres-demo:
      start: >-
        env UID=$(id -u) GID=$(stat -c %g . 2>/dev/null || id -g) INSTANCE_LABEL={{branch.name}} DAEMON_PORT={{add 3000 branch.unique_id}} UI_PORT={{add 5000
        branch.unique_id}} AGOR_BASE_URL=http://{{host.ip_address}}:{{add 5000 branch.unique_id}} VITE_DAEMON_URL=http://{{host.ip_address}}:{{add 3000 branch.unique_id}} AGOR_MIGRATION_OFFLINE_CUTOVER=true SEED=true LOAD_FIXTURES=true docker compose -f docker-compose.yml -f
        docker-compose.override.postgres.yml -p agor-{{branch.name}} --profile postgres up -d
        --build postgres agor-dev
      stop: >-
        docker compose -f docker-compose.yml -f docker-compose.override.postgres.yml -p
        agor-{{branch.name}} --profile postgres down
      description: >-
        PostgreSQL + development seed + four-user demo fixtures; RBAC and sandbox off. Development
        only.
      extends: sqlite
      nuke: >-
        docker compose -f docker-compose.yml -f docker-compose.override.postgres.yml -p
        agor-{{branch.name}} --profile postgres down -v
      logs: >-
        docker compose -f docker-compose.yml -f docker-compose.override.postgres.yml -p
        agor-{{branch.name}} --profile postgres logs --tail=100
