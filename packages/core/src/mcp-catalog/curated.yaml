# - MongoDB publishes no DCR endpoint or reviewed public client for Agor. (Box,
#   Slack, HubSpot, and Google Workspace are now customer-owned app entries above.)
# - Power BI is tenant-admin gated and has no DCR.
# - GitHub's OAuth route publishes no DCR; the entry above uses its documented PAT route instead.
# - Prisma publishes an authorization-server issuer chain that does not bind safely; PagerDuty's
#   OAuth route has no DCR, so its entry above uses the documented user API token instead.
# - Kagi challenges with Bearer but publishes neither protected-resource nor authorization-server metadata.
