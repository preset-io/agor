  - name: com.slack/mcp
    title: Slack (official MCP)
    category: messaging
    capabilities: [messages, channels, files]
    benefit: Search and read Slack conversations, canvases, and files from an agent session, and post when you ask. Complements Agor's Slack gateway rather than replacing it.
    starter_prompt: Search Slack for this week's discussion of the topic I name and summarise the decisions with links. Do not post anything.
    permission_disclosure: Requires your own internal or Slack Marketplace app (unlisted apps cannot use MCP) with the user scopes this entry requests, approved by a workspace admin. Acts as your Slack user and can search and read channels, DMs, canvases, lists, and files you can access, and can post messages, react, and edit canvases and lists. Data returned by Slack is sent to the agent and AI provider running this Agor session.
