# The MCP catalog.
#
# This file is the catalog. The marketplace offers its visible entries
# and nothing else, so a visible entry added is a server users can find and an entry
# removed is one they can no longer install. It lives in the repository rather
# than in an admin UI so every change is reviewed in a pull request and rolls
# back like code.
#
# `hidden: true` removes discovery and new catalog installs by name, not saved
# connections, grants, reconnect, or runtime policy. Omit it or set false to
# re-enable after review and redeploy (the catalog is process-cached). Hidden
# definitions still undergo full validation and remain available to maintenance.
#
# `name` is the reverse-DNS identity, unique across both lists, and it is what
# an installed server records — so renaming an entry orphans every install of
# it. Entries are split by whether that name is something the MCP registry
# confirms or something Agor inferred:
#
#   entries:      the registry publishes a server under exactly this name.
#   unpublished:  the vendor runs a public MCP endpoint but has not published to
#                 the registry, so the name is Agor's reverse-DNS guess.
#
# The split is a record of where the name came from, not a ranking: an entry
# under `unpublished:` is offered on the same shelf and connects the same way.
# Nothing here says the vendor endorses Agor. When a vendor publishes under an
# entry's exact name, moving it into `entries:` is the only change needed.
#
# `auth_type` is what the endpoint asks of a client: `none`, `oauth`, or
# `credentials`. It decides what the marketplace tells a user before they press
# Connect, and nothing more: connecting probes the endpoint and takes its
# answer, because this file records what was true when it was last edited and a
# vendor can change it in either direction at any time. Omit the key where
# nobody has established the answer — absence reads as "not stated", and an
# entry that says nothing is still offered. Whichever way a stated value is
# wrong, the probe overrules it and the daemon logs the disagreement, so a
# stale value shows up in the logs rather than sitting here indefinitely.
#
# None of the three is a reason not to list an entry. `oauth` signs the user in
# after connecting; `credentials` takes a key the user pastes into the drawer.
# What must never appear in this file is the key itself, or any other secret: it
# is checked into a public repository and is byte-identical for every tenant, so
# a secret written here is a published secret shared by everyone. A per-user
# credential is supplied at connect time and stored per install. Point
# `website_url` at the vendor's own page for a `credentials` entry — it is what
# the drawer links to under "Where to find it".
#
# `popularity_rank` is hand-assigned, informed by relative install volume on
# Smithery. Smithery's raw counts are deliberately not stored or displayed: they
# measure traffic through Smithery, not installs, and presenting them as Agor's
# number would be wrong.

# Entries the registry publishes under exactly this `name`.
entries:
  - name: app.linear/linear
