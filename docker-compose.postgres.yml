# PostgreSQL + RBAC Testing Environment
# Extends base docker-compose.yml with PostgreSQL database and RBAC features
#
# Usage: docker compose --profile postgres up
#
# This profile provides:
# - PostgreSQL database (instead of SQLite)
# - RBAC + Unix integration enabled
# - Test users (alice, bob) with Unix accounts
# - Test branches with ownership configured
#
# To test as alice/bob: docker exec -it <container> sudo su alice

services:
  agor-dev:
    # Full/strict environments select this file explicitly, so Compose does
    # not auto-load docker-compose.override.yml. Permit Codex's nested Linux
    # sandbox here as part of the self-contained full environment overlay.
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    environment:
      # PostgreSQL database configuration
      - AGOR_DB_DIALECT=postgresql
      - DATABASE_URL=postgresql://agor_app:agor_dev_secret@postgres:5432/agor

      # PostgreSQL startup skips the SQLite-only `agor init`, so provide the
      # stable development secrets that production supplies via its secret
      # manager. These values are intentionally local-environment-only.
      - AGOR_JWT_SECRET=${AGOR_JWT_SECRET:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      - AGOR_MASTER_SECRET=${AGOR_MASTER_SECRET:-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}

      # Enable RBAC + Unix integration
      - AGOR_RBAC_ENABLED=${AGOR_RBAC_ENABLED:-true}
      - AGOR_UNIX_USER_MODE=${AGOR_UNIX_USER_MODE:-insulated}

      # Create test users (alice, bob) on startup
      - CREATE_RBAC_TEST_USERS=${CREATE_RBAC_TEST_USERS:-true}

    # Use PostgreSQL+RBAC-specific entrypoint
    entrypoint: ['/usr/local/bin/docker-entrypoint-postgres.sh']
