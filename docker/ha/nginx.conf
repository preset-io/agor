events {}

http {
  # This single ingress process is the fleet-wide choke point for the Compose
  # topology. Keep a coarse IP backstop here so adding daemon replicas does not
  # multiply the daemon-local authentication/launch limiter. Production Cloud
  # needs the equivalent shared edge/WAF policy across all ingress replicas.
  limit_req_zone $binary_remote_addr zone=agor_sensitive_per_ip:10m rate=5r/s;

  log_format agor_upstream '$remote_addr "$request" $status '
    'upstream=$upstream_addr request_time=$request_time upstream_time=$upstream_response_time';
  access_log /dev/stdout agor_upstream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream agor_http {
    # Ordinary HTTP/REST is stateless at the ingress layer and should exercise
    # both ready replicas rather than inheriting Engine.IO affinity.
    server daemon-a:3030 max_fails=1 fail_timeout=5s;
    server daemon-b:3030 max_fails=1 fail_timeout=5s;
  }

  upstream agor_socketio {
    # Engine.IO polling creates several HTTP requests for one logical session.
    # Keep them on one daemon; WebSocket-only assumptions are not sufficient.
    hash $remote_addr consistent;
    server daemon-a:3030 max_fails=1 fail_timeout=5s;
    server daemon-b:3030 max_fails=1 fail_timeout=5s;
  }

  server {
    listen 8080;
    limit_req_status 429;
    # Do not hold a new request on a dead named daemon for nginx's 60-second
    # default before trying the peer. Read/send timeouts for established
    # Socket.IO connections remain independently long below.
    proxy_connect_timeout 3s;

    location = /nginx-health {
      access_log off;
      return 200 'ok\n';
    }

    location /socket.io/ {
      proxy_pass http://agor_socketio;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Socket.IO pingInterval + pingTimeout is 85s. Stay safely above it.
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location ~ ^/(?:authentication(?:/refresh)?|auth/launch)/?$ {
      # A deliberately coarse topology proof, not the product's credential-
      # aware quota. The daemon still applies its normal composite-key limits.
      limit_req zone=agor_sensitive_per_ip burst=20 nodelay;
      add_header X-Agor-Edge-Rate-Limit compose-per-ip always;

      proxy_pass http://agor_http;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location / {
      proxy_pass http://agor_http;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
