name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/agor-docs/**'
      - 'apps/agor-cli/src/commands/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build git package
        run: pnpm --filter @agor/git build

      - name: Build core package
        run: pnpm --filter @agor/core build

      - name: Build docs
        run: pnpm --filter @agor/docs build
        env:
          # GA measurement IDs are public identifiers, not secrets. Keep this
          # explicit so static exports cannot silently lose production analytics.
          NEXT_PUBLIC_GA_ID: G-DME77D3LDH

      - name: Verify production analytics export
        run: pnpm --filter @agor/docs validate:analytics
        env:
          NEXT_PUBLIC_GA_ID: G-DME77D3LDH

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/agor-docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
