# Build the exact npm release artifacts once, then install and exercise those
# bytes under the supported Node policy. Pull requests cover the minimum and
# one representative current-LTS lane; release/manual callers get the full matrix.
name: agor-live packaged install smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/agor-live/**'
      - 'packages/client/**'
      - 'packages/core/**'
      - 'packages/git/**'
      - 'packages/executor/**'
      - 'packages/agentic-tool-opencode/**'
      - 'packages/agentic-tools/**'
      - 'packages/agor-*/**'
      - 'apps/agor-daemon/**'
      - 'apps/agor-cli/**'
      - 'apps/agor-ui/**'
      - 'scripts/sync-agor-live-deps.mjs'
      - 'scripts/check-agentic-tool-packages.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agor-live-smoke.yml'
      - '.github/workflows/release-agor-live.yml'
  workflow_dispatch:
  workflow_call:

env:
  PNPM_VERSION: '11.17.0'

jobs:
  build-artifacts:
    name: Build immutable release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'pnpm'

      # npm pack owns the release tarball bytes. Pin it independently of the
      # runner image so a tag retry rebuilds the same artifacts.
      - run: npm install -g --ignore-scripts npm@11.16.0

      - run: pnpm install --frozen-lockfile

      - name: Set reproducible build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "AGOR_BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "AGOR_BUILT_AT=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Build and pack once
        run: packages/agor-live/build.sh --skip-install
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Inspect release contract
        run: |
          set -euo pipefail
          RELEASE=packages/agor-live/release
          LIVE=$(ls "$RELEASE"/agor-live-[0-9]*.tgz)
          CLIENT=$(ls "$RELEASE"/agor-live-client-*.tgz)
          test -n "$LIVE"
          test -n "$CLIENT"
          test "$(find "$RELEASE" -maxdepth 1 -name '*.tgz' | wc -l)" -eq 8
          mkdir -p "$RUNNER_TEMP/inspect"
          tar -xzf "$LIVE" -C "$RUNNER_TEMP/inspect"
          node - "$RUNNER_TEMP/inspect/package/package.json" <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const lifecycle = ['preinstall', 'install', 'postinstall'].filter(
            (name) => manifest.scripts?.[name]
          );
          if (lifecycle.length) throw new Error(`Release has install lifecycle hooks: ${lifecycle}`);
          if (JSON.stringify(manifest).includes('workspace:')) {
            throw new Error('workspace:* leaked into the release manifest');
          }
          const expected = [
            '@agor/agentic-tool-opencode', '@agor/agentic-tools', '@agor/core', '@agor/git',
          ];
          if (JSON.stringify(manifest.bundleDependencies?.sort()) !== JSON.stringify(expected.sort())) {
            throw new Error(`Unexpected bundleDependencies: ${manifest.bundleDependencies}`);
          }
          NODE
          for package in agentic-tool-opencode agentic-tools core git; do
            test -d "$RUNNER_TEMP/inspect/package/node_modules/@agor/$package"
            test ! -L "$RUNNER_TEMP/inspect/package/node_modules/@agor/$package"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: agor-live-release
          path: packages/agor-live/release/*.tgz
          if-no-files-found: error
          retention-days: 7

  packaged-smoke:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: build-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","node":"22.13.0"},{"os":"ubuntu-latest","node":"24.19.0"}]' || '[{"os":"ubuntu-latest","node":"22.13.0"},{"os":"ubuntu-latest","node":"24.19.0"},{"os":"ubuntu-latest","node":"26"},{"os":"macos-latest","node":"24.19.0"}]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - uses: actions/download-artifact@v7
        with:
          name: agor-live-release
          path: ${{ runner.temp }}/release

      - name: Locate artifacts
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$RUNNER_TEMP/release"
          echo "LIVE=$(ls "$RELEASE"/agor-live-[0-9]*.tgz)" >> "$GITHUB_ENV"
          echo "CLIENT=$(ls "$RELEASE"/agor-live-client-*.tgz)" >> "$GITHUB_ENV"
          echo "CLAUDE=$(ls "$RELEASE"/agor-live-claude-*.tgz)" >> "$GITHUB_ENV"
          echo "CODEX=$(ls "$RELEASE"/agor-live-codex-*.tgz)" >> "$GITHUB_ENV"
          echo "COPILOT=$(ls "$RELEASE"/agor-live-copilot-*.tgz)" >> "$GITHUB_ENV"
          echo "CURSOR=$(ls "$RELEASE"/agor-live-cursor-*.tgz)" >> "$GITHUB_ENV"
          echo "GEMINI=$(ls "$RELEASE"/agor-live-gemini-*.tgz)" >> "$GITHUB_ENV"
          echo "OPENCODE=$(ls "$RELEASE"/agor-live-opencode-*.tgz)" >> "$GITHUB_ENV"

      - name: Plain global install is script-independent
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/plain-install"
          mkdir -p "$ROOT/home"
          npm install -g --prefix "$ROOT/prefix" --cache "$ROOT/cache" \
            --no-fund --no-audit "$CLIENT" "$LIVE"
          PACKAGE_ROOT="$ROOT/prefix/lib/node_modules/agor-live"
          for package in agentic-tool-opencode agentic-tools core git; do
            test -d "$PACKAGE_ROOT/node_modules/@agor/$package"
            test ! -L "$PACKAGE_ROOT/node_modules/@agor/$package"
          done
          test ! -e "$PACKAGE_ROOT/node_modules/hot-shots"
          test ! -e "$ROOT/prefix/lib/node_modules/hot-shots"
          if find "$ROOT/prefix/lib/node_modules" -type d -name unix-dgram -print -quit | grep -q .; then
            echo "Default install unexpectedly contains unix-dgram" >&2
            exit 1
          fi
          HOME="$ROOT/home" "$ROOT/prefix/bin/agor" doctor --json > "$ROOT/doctor.json"

          # Importing the metrics composition module must not resolve the peer
          # while the default-disabled exporter is in use.
          node --input-type=module - "$PACKAGE_ROOT" <<'NODE'
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const packageRoot = process.argv[2];
          const metricsModule = await import(
            pathToFileURL(join(packageRoot, 'dist/daemon/metrics/index.js')).href
          );
          const metrics = metricsModule.createDaemonMetrics(undefined, {
            workIdentity: { instanceId: 'standalone', bootId: 'smoke' },
            deploymentMode: 'standalone',
            deploymentId: 'smoke',
          });
          if (metrics.enabled) throw new Error('Default metrics exporter must be disabled');
          const warnings = [];
          const originalWarn = console.warn;
          console.warn = (message) => warnings.push(String(message));
          const missingPeerMetrics = metricsModule.createDaemonMetrics(
            { enabled: true },
            {
              workIdentity: { instanceId: 'standalone', bootId: 'smoke' },
              deploymentMode: 'standalone',
              deploymentId: 'smoke',
            }
          );
          console.warn = originalWarn;
          if (missingPeerMetrics.enabled) throw new Error('Missing peer must fall back to no-op');
          if (!warnings.some((warning) => warning.includes('optional hot-shots peer dependency'))) {
            throw new Error(`Missing peer warning was not actionable: ${JSON.stringify(warnings)}`);
          }
          NODE

          # A second install with lifecycle execution forcibly disabled must be
          # equally usable. This is a release invariant, not a user instruction.
          NOSCRIPTS="$RUNNER_TEMP/no-scripts-install"
          npm install -g --prefix "$NOSCRIPTS/prefix" --cache "$NOSCRIPTS/cache" \
            --no-fund --no-audit --ignore-scripts "$CLIENT" "$LIVE"
          HOME="$NOSCRIPTS/home" "$NOSCRIPTS/prefix/bin/agor" doctor --json >/dev/null

          # Prove the optional prebuilt PTY can create a real pseudo-terminal,
          # not merely that its JavaScript entry point imports.
          node --input-type=module - "$PACKAGE_ROOT" <<'NODE'
          import { createRequire } from 'node:module';
          import { join } from 'node:path';
          const packageRoot = process.argv[2];
          const require = createRequire(join(packageRoot, 'package.json'));
          const pty = require('@lydell/node-pty');
          const marker = 'packaged-pty-ready';
          const child = pty.spawn(process.execPath, ['-e', `process.stdout.write('${marker}')`], {
            name: 'xterm', cols: 80, rows: 24, cwd: packageRoot, env: process.env,
          });
          let output = '';
          child.onData((chunk) => { output += chunk; });
          await new Promise((resolve, reject) => child.onExit(({ exitCode }) => {
            if (exitCode === 0 && output.includes(marker)) resolve();
            else reject(new Error(`PTY failed: exit=${exitCode}, output=${JSON.stringify(output)}`));
          }));
          NODE

      - name: Packaged offline-install manager runs at the Node floor
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/plain-install"
          PACKAGE_ROOT="$ROOT/prefix/lib/node_modules/agor-live"
          mkdir -p "$ROOT/offline-home"
          node --input-type=module - "$PACKAGE_ROOT" "$ROOT/offline-home" <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { realpath } from 'node:fs/promises';
          import { isAbsolute, join, relative } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const [packageRoot, home] = process.argv.slice(2);
          const fixture = await import(
            pathToFileURL(
              `${packageRoot}/dist/executor/handlers/sdk/offline-install-fixture.js`
            ).href
          );
          const { executable, argv } = fixture.OFFLINE_INSTALL_COMMANDS.packageManagerVersion;
          const entrypoint = fixture.OFFLINE_INSTALL_PACKAGE_MANAGER_ENTRYPOINT;
          if (executable !== process.execPath || argv[0] !== entrypoint || !isAbsolute(entrypoint)) {
            throw new Error(`Offline-install did not use its absolute Node entrypoint: ${entrypoint}`);
          }
          const [canonicalPackageRoot, canonicalEntrypoint] = await Promise.all([
            realpath(packageRoot),
            realpath(entrypoint),
          ]);
          const packageManagerPath = relative(
            join(canonicalPackageRoot, 'node_modules/pnpm'),
            canonicalEntrypoint
          );
          if (packageManagerPath.startsWith('..') || isAbsolute(packageManagerPath)) {
            throw new Error(`Offline-install pnpm escaped the package tree: ${entrypoint}`);
          }
          const result = spawnSync(executable, argv, {
            cwd: packageRoot,
            encoding: 'utf8',
            env: {
              CI: 'true',
              COREPACK_ENABLE_DOWNLOAD_PROMPT: '0',
              COREPACK_ENABLE_NETWORK: '0',
              HOME: home,
              PATH: '/no-ambient-package-manager',
            },
          });
          if (result.status !== 0 || result.stdout.trim() !== '11.17.0') {
            throw new Error(
              `Packaged pnpm failed: status=${result.status}, stdout=${JSON.stringify(result.stdout)}, stderr=${JSON.stringify(result.stderr)}`
            );
          }
          NODE

      - name: Optional StatsD peer works without lifecycle scripts
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.19.0'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/statsd-peer"
          npm install -g --prefix "$ROOT/prefix" --cache "$ROOT/cache" \
            --no-fund --no-audit "$CLIENT" "$LIVE"
          npm install -g --prefix "$ROOT/prefix" --cache "$ROOT/cache" \
            --no-fund --no-audit --ignore-scripts \
            hot-shots@17.1.0
          PACKAGE_ROOT="$ROOT/prefix/lib/node_modules/agor-live"
          test -d "$ROOT/prefix/lib/node_modules/hot-shots"
          node --input-type=module - "$PACKAGE_ROOT" <<'NODE'
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const packageRoot = process.argv[2];
          const metricsModule = await import(
            pathToFileURL(join(packageRoot, 'dist/daemon/metrics/index.js')).href
          );
          const metrics = metricsModule.createDaemonMetrics(
            { enabled: true, host: '127.0.0.1', port: 8125, prefix: 'agor.smoke.' },
            {
              workIdentity: { instanceId: 'standalone', bootId: 'smoke' },
              deploymentMode: 'standalone',
              deploymentId: 'smoke',
            }
          );
          if (!metrics.enabled) throw new Error('StatsD peer did not initialize');
          await metrics.close();
          NODE

      - name: A missing optional PTY does not block Agor
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.19.0'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/no-optional"
          npm install -g --prefix "$ROOT/prefix" --cache "$ROOT/cache" \
            --no-fund --no-audit --ignore-scripts "$CLIENT" "$LIVE"
          # Deterministically model an unavailable platform artifact. npm's
          # handling of --omit=optional for global local-tarball installs has
          # varied, so omission itself is not the contract under test.
          rm -rf "$ROOT/prefix/lib/node_modules/agor-live/node_modules/@lydell"
          HOME="$ROOT/home" "$ROOT/prefix/bin/agor" doctor --json > "$ROOT/doctor.json"
          node - "$ROOT/doctor.json" <<'NODE'
          const report = require(process.argv[2]);
          if (report.optionalCapabilities?.webTerminal?.status !== 'unavailable') {
            throw new Error(`Expected optional terminal to be unavailable: ${JSON.stringify(report)}`);
          }
          if (!report.ok) throw new Error('An optional terminal must not make doctor fail');
          NODE

      - name: Fresh init installs a selected tool with scripts disabled
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/init-smoke"
          REAL_NPM=$(command -v npm)
          mkdir -p "$ROOT/npm-shim" "$ROOT/home"
          cat > "$ROOT/npm-shim/npm" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for arg in "$@"; do
            if [[ "$arg" == @agor-live/codex@* ]]; then args+=("$AGOR_SMOKE_CODEX");
            else args+=("$arg"); fi
          done
          exec "$AGOR_SMOKE_REAL_NPM" "${args[@]}"
          SH
          chmod +x "$ROOT/npm-shim/npm"
          export HOME="$ROOT/home"
          export AGOR_AGENTIC_TOOLS_DIR="$HOME/.agor/agentic-tools"
          export PATH="$ROOT/npm-shim:$PATH"
          export AGOR_SMOKE_REAL_NPM="$REAL_NPM"
          export AGOR_SMOKE_CODEX="$CODEX"
          # Model an upgrade initiated from an executor spawned by the prior
          # Agor version. The newly installed launcher must own AGOR_VERSION.
          export AGOR_VERSION=0.0.0-stale
          AGOR_TELEMETRY=0 "$RUNNER_TEMP/plain-install/prefix/bin/agor" init \
            --non-interactive --agentic-tools codex
          AGOR_TELEMETRY=0 "$RUNNER_TEMP/plain-install/prefix/bin/agor" doctor --json \
            > "$ROOT/doctor.json"
          node - "$ROOT/doctor.json" <<'NODE'
          const report = require(process.argv[2]);
          const codex = report.agenticTools?.find((tool) => tool.id === 'codex');
          if (codex?.status !== 'ready') throw new Error(`Codex not ready: ${JSON.stringify(codex)}`);
          NODE

      - name: npm 12 and native managed tools need no lifecycle approval
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.19.0'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/npm12"
          npm install --prefix "$ROOT/npm" --ignore-scripts --no-fund --no-audit npm@12.0.2
          NPM12="$ROOT/npm/node_modules/npm/bin/npm-cli.js"
          node "$NPM12" install -g --prefix "$ROOT/prefix" --cache "$ROOT/cache" \
            --no-fund --no-audit "$CLIENT" "$LIVE"
          HOME="$ROOT/base-home" "$ROOT/prefix/bin/agor" doctor --json >/dev/null

          mkdir -p "$ROOT/npm-shim" "$ROOT/home"
          cat > "$ROOT/npm-shim/npm" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for arg in "$@"; do
            if [[ "$arg" == @agor-live/opencode@* ]]; then args+=("$AGOR_SMOKE_OPENCODE");
            elif [[ "$arg" == @agor-live/gemini@* ]]; then args+=("$AGOR_SMOKE_GEMINI");
            else args+=("$arg"); fi
          done
          exec node "$AGOR_SMOKE_NPM12" "${args[@]}"
          SH
          chmod +x "$ROOT/npm-shim/npm"
          export HOME="$ROOT/home"
          export AGOR_AGENTIC_TOOLS_DIR="$HOME/.agor/agentic-tools"
          export PATH="$ROOT/npm-shim:$PATH"
          export AGOR_SMOKE_NPM12="$NPM12"
          export AGOR_SMOKE_OPENCODE="$OPENCODE"
          export AGOR_SMOKE_GEMINI="$GEMINI"
          AGOR_TELEMETRY=0 "$ROOT/prefix/bin/agor" init \
            --non-interactive --agentic-tools opencode,gemini
          AGOR_TELEMETRY=0 "$ROOT/prefix/bin/agor" doctor --json > "$ROOT/doctor.json"
          node - "$ROOT/doctor.json" <<'NODE'
          const report = require(process.argv[2]);
          for (const id of ['opencode', 'gemini']) {
            const tool = report.agenticTools?.find((item) => item.id === id);
            if (tool?.status !== 'ready') throw new Error(`${id} not ready: ${JSON.stringify(tool)}`);
          }
          NODE
          VERSION=$(node -p "require('$ROOT/prefix/lib/node_modules/agor-live/package.json').version")
          TOOLS="$HOME/.agor/agentic-tools/$VERSION"
          test ! -e "$TOOLS/opencode/node_modules/opencode-ai/bin/.opencode"
          test -x "$TOOLS/opencode/node_modules/opencode-linux-x64/bin/opencode"

          # OpenCode's standard launcher discovers its platform optional package
          # at runtime when postinstall has not created bin/.opencode.
          EXPECTED_OPENCODE=$(node -p \
            "require('$TOOLS/opencode/node_modules/opencode-ai/package.json').version")
          test "$(node "$TOOLS/opencode/node_modules/opencode-ai/bin/opencode" --version)" \
            = "$EXPECTED_OPENCODE"

          # Exercise the public Gemini SDK paths that consume its scriptless
          # PTY prebuild and Bash parser WASM. Keep this vendor-specific proof
          # in release CI rather than coupling Agor production modules to the
          # vendor's private package layout.
          node --input-type=module - "$TOOLS/gemini" <<'NODE'
          import { pathToFileURL } from 'node:url';
          const root = process.argv[2];
          const { sdk } = await import(pathToFileURL(`${root}/node_modules/@agor-live/gemini/dist/index.js`).href);
          const selectedPty = await sdk.getPty();
          if (selectedPty?.name !== 'lydell-node-pty') throw new Error('Gemini did not select its scriptless PTY');
          const marker = 'gemini-pty-ready';
          const child = selectedPty.module.spawn(
            process.execPath,
            ['-e', `process.stdout.write('${marker}')`],
            { name: 'xterm', cols: 80, rows: 24, cwd: root, env: process.env }
          );
          let output = '';
          child.onData((chunk) => { output += chunk; });
          await new Promise((resolve, reject) => child.onExit(({ exitCode }) => {
            if (exitCode === 0 && output.includes(marker)) resolve();
            else reject(new Error(`Gemini PTY failed: ${exitCode}, ${JSON.stringify(output)}`));
          }));
          await sdk.initializeShellParsers();
          const parsed = sdk.parseBashCommandDetails('echo agor-gemini-ready');
          if (!parsed?.details?.some(({ name }) => name === 'echo')) {
            throw new Error('Gemini Bash parser WASM did not initialize');
          }
          NODE

      - name: Clean project install, daemon boot, UI, and Git clone
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.19.0'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/project-smoke"
          mkdir -p "$ROOT/project"
          mkdir -p -m 0700 "$ROOT/home/.agor"
          test "$(stat -c '%a' "$ROOT/home/.agor")" = "700"
          cd "$ROOT/project"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-fund --no-audit "$CLIENT" "$LIVE"
          PACKAGE_ROOT="$ROOT/project/node_modules/agor-live"
          cat > "$ROOT/home/.agor/config.yaml" <<'EOF'
          daemon:
            port: 3030
            deployment_id: 019c1234-5678-7123-8123-123456789abc
          agentic_tools:
            installed: []
          EOF
          export HOME="$ROOT/home"
          export AGOR_JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          export AGOR_MASTER_SECRET=abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          echo "" | node "$PACKAGE_ROOT/bin/agor.js" db migrate
          node "$PACKAGE_ROOT/bin/agor.js" daemon start
          trap 'node "$PACKAGE_ROOT/bin/agor.js" daemon stop || true' EXIT
          for i in $(seq 1 45); do
            curl -fsS http://localhost:3030/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:3030/health >/dev/null
          curl -fsS http://localhost:3030/ui/ > "$ROOT/index.html"
          grep -qi '<!doctype html>' "$ROOT/index.html"
          ENTRY_ASSET=$(node - "$ROOT/index.html" <<'NODE'
          const html = require('node:fs').readFileSync(process.argv[2], 'utf8');
          const entry = html.match(/<script[^>]+src=["']([^"']+\.js)["']/i)?.[1];
          if (!entry) throw new Error('Packaged UI has no JavaScript entry asset');
          process.stdout.write(entry);
          NODE
          )
          case "$ENTRY_ASSET" in
            /ui/*) ;;
            *) echo "::error::Unexpected packaged UI entry path: $ENTRY_ASSET"; exit 1 ;;
          esac
          curl -fsS -D "$ROOT/asset.headers" -o "$ROOT/entry.js" \
            "http://localhost:3030${ENTRY_ASSET}"
          grep -Eqi '^content-type:.*(javascript|ecmascript)' "$ROOT/asset.headers"
          test "$(wc -c < "$ROOT/entry.js")" -gt 1000

          node --input-type=module - "$ROOT" "$PACKAGE_ROOT" <<'NODE'
          import { existsSync } from 'node:fs';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { createRequire } from 'node:module';
          import { pathToFileURL } from 'node:url';
          const [root, packageRoot] = process.argv.slice(2);
          const { cloneRepo } = await import(pathToFileURL(`${packageRoot}/node_modules/@agor/git/index.js`).href);
          // Resolve from the package's consumer context: npm may hoist this
          // dependency to the project root or keep it nested.
          const require = createRequire(`${packageRoot}/package.json`);
          const { simpleGit } = require('simple-git');
          const source = `${root}/clone-source`;
          await mkdir(source, { recursive: true });
          const git = simpleGit(source);
          await git.init(['--initial-branch=main']);
          await git.addConfig('user.name', 'Agor smoke');
          await git.addConfig('user.email', 'smoke@invalid.example');
          await writeFile(`${source}/README.md`, '# smoke\n');
          await git.add('README.md');
          await git.commit('fixture');
          const result = await cloneRepo({ url: source, targetDir: `${root}/clone-target`, env: {} });
          if (!existsSync(`${result.path}/.git`)) throw new Error('Packaged clone did not create .git');
          NODE

  all-integrations-smoke:
    name: All packaged agent integrations
    if: github.event_name != 'pull_request'
    needs: build-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - uses: actions/download-artifact@v7
        with:
          name: agor-live-release
          path: ${{ runner.temp }}/release

      - name: Install all exact integration artifacts with scripts disabled
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/all-integrations"
          RELEASE="$RUNNER_TEMP/release"
          REAL_NPM=$(command -v npm)
          LIVE=$(ls "$RELEASE"/agor-live-[0-9]*.tgz)
          CLIENT=$(ls "$RELEASE"/agor-live-client-*.tgz)
          mkdir -p "$ROOT/home" "$ROOT/npm-shim"
          npm install -g --prefix "$ROOT/prefix" --cache "$ROOT/cache" \
            --no-fund --no-audit --ignore-scripts "$CLIENT" "$LIVE"

          cat > "$ROOT/npm-shim/npm" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for arg in "$@"; do
            case "$arg" in
              @agor-live/claude@*) artifact="$AGOR_SMOKE_CLAUDE" ;;
              @agor-live/codex@*) artifact="$AGOR_SMOKE_CODEX" ;;
              @agor-live/copilot@*) artifact="$AGOR_SMOKE_COPILOT" ;;
              @agor-live/cursor@*) artifact="$AGOR_SMOKE_CURSOR" ;;
              @agor-live/gemini@*) artifact="$AGOR_SMOKE_GEMINI" ;;
              @agor-live/opencode@*) artifact="$AGOR_SMOKE_OPENCODE" ;;
              *) artifact="$arg" ;;
            esac
            args+=("$artifact")
          done
          exec "$AGOR_SMOKE_REAL_NPM" "${args[@]}"
          SH
          chmod +x "$ROOT/npm-shim/npm"

          export HOME="$ROOT/home"
          export AGOR_AGENTIC_TOOLS_DIR="$HOME/.agor/agentic-tools"
          export PATH="$ROOT/npm-shim:$PATH"
          export AGOR_SMOKE_REAL_NPM="$REAL_NPM"
          for id in claude codex copilot cursor gemini opencode; do
            upper=${id^^}
            artifact=$(ls "$RELEASE"/agor-live-"$id"-*.tgz)
            export "AGOR_SMOKE_$upper=$artifact"
          done

          AGOR_TELEMETRY=0 "$ROOT/prefix/bin/agor" init --non-interactive \
            --agentic-tools claude,codex,copilot,cursor,gemini,opencode
          AGOR_TELEMETRY=0 "$ROOT/prefix/bin/agor" doctor --json > "$ROOT/doctor.json"
          node - "$ROOT/doctor.json" <<'NODE'
          const report = require(process.argv[2]);
          const expected = ['claude-code', 'codex', 'copilot', 'cursor', 'gemini', 'opencode'];
          for (const id of expected) {
            const tool = report.agenticTools?.find((item) => item.id === id);
            if (tool?.status !== 'ready') throw new Error(`${id} not ready: ${JSON.stringify(tool)}`);
          }
          NODE
