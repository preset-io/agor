packages:
  - apps/*
  - packages/*
overrides:
  '@codemirror/state': 6.7.0
  '@codemirror/view': 6.43.0
  '@esbuild-kit/core-utils>esbuild': 0.25.4
  '@google/genai': ^1.43.0
  # Gemini core still uses Zod 3 APIs; keep it out of the workspace-wide Zod 4 override.
  '@google/gemini-cli-core>zod': ^3.25.76
  '@github/copilot': '>=1.0.43 <2'
  '@grpc/grpc-js': '>=1.14.4 <2'
  '@hono/node-server': '>=1.19.14 <2'
  '@isaacs/brace-expansion': '>=5.0.1 <6'
  '@modelcontextprotocol/sdk': '>=1.29.0 <2'
  '@xmldom/xmldom': '>=0.9.10 <1'
  ajv: '>=8.18.0 <9'
  axios: '>=1.18.0 <2'
  # ansi-to-react is still on vulnerable linkify-it 3.x; remove when it accepts >=5.0.2.
  ansi-to-react>linkify-it: '>=5.0.2 <6'
  botbuilder>zod: ^3.25.0
  body-parser@<2: '>=1.20.6 <2'
  body-parser@>=2 <3: '>=2.3.0 <3'
  brace-expansion@<2.1.3: '>=2.1.3 <3'
  brace-expansion@>=4.0.0 <5.0.8: '>=5.0.8 <6'
  diff: '>=8.0.3 <9'
  dompurify: '>=3.4.12 <4'
  esbuild: '>=0.25.0 <0.26'
  express-rate-limit: '>=8.2.2 <9'
  fast-uri: '>=3.1.4 <4'
  fast-xml-parser: '>=5.5.7 <6'
  follow-redirects: '>=1.16.0 <2'
  glob: ^11.1.0
  handlebars: '>=4.7.9 <5'
  hono: '>=4.12.34 <5'
  jws: '>=4.0.1 <5'
  js-yaml: '>=4.3.1 <5'
  lodash: '>=4.18.1 <5'
  lodash-es: '>=4.18.1 <5'
  mdast-util-to-hast: '>=13.2.1 <14'
  mermaid: '>=11.14.1 <12'
  minimatch@<5.1.8: '>=5.1.8 <6'
  minimatch@>=10.0.0 <10.2.3: '>=10.2.3 <11'
  nanoid: '>=3.3.17 <4'
  nextra-theme-docs>zod: 4.1.12
  nextra>zod: 4.1.12
  npm-run-path: ^5.3.0
  path-to-regexp@<0.1.13: '>=0.1.13 <0.2'
  path-to-regexp@>=8.0.0 <8.4.2: '>=8.4.2 <9'
  postcss: '>=8.5.18 <9'
  picomatch: '>=4.0.4 <5'
  protobufjs@<7.6.5: '>=7.6.5 <8'
  protobufjs@>=8.0.0 <8.0.1: '>=8.0.1 <9'
  qs: '>=6.14.2 <7'
  rollup: 4.62.4
  shell-quote: '>=1.8.5 <2'
  shiki: 3.23.0
  smol-toml: '>=1.6.1 <2'
  engine.io: '>=6.6.7 <7'
  socket.io-parser: '>=4.2.7 <5'
  systeminformation: '>=5.31.7 <6'
  tar@<7.5.21: '>=7.5.21 <8'
  # Keep Vite's optional tsx peer on the reviewed release until 4.23.5 clears minimumReleaseAge.
  tsx: 4.23.1
  undici: '>=7.28.0 <8'
  vite: '>=8.2.0 <9'
  ws: '>=8.21.0 <9'
  yaml: '>=2.8.3 <3'
  zod: ^4.3.6
peerDependencyRules:
  ignoreMissing:
    - '@opentelemetry/core'
    - '@opentelemetry/resources'
    - '@opentelemetry/sdk-metrics'
    - '@opentelemetry/sdk-trace-base'
  allowedVersions:
    zod: '*'
allowBuilds:
  # Prebuilt binaries ship with the package; the build script is only a fallback.
  '@parcel/watcher': false
  '@github/keytar@7.10.6': false
  '@scarf/scarf@1.4.0': false
  'es5-ext@0.10.64': false
  'esbuild@0.25.4 || 0.25.12': true
  'keytar@7.9.0': true
  'node-pty@1.0.0': true
  'opencode-ai@1.14.33': true
  'protobufjs@7.5.8 || 7.6.5': false
  'sharp@0.34.5': true
  'sqlite3@5.1.7': true
  'tree-sitter-bash@0.25.0': true
  # Scalar's React wrapper uses its Vue core; vue-demi selects the installed Vue runtime.
  'vue-demi@0.14.10': true
  # hot-shots uses this optional native addon only for Unix-domain sockets;
  # Agor's exporter deliberately uses UDP to the local Agent.
  'unix-dgram@2.0.7': false
patchedDependencies:
  streamdown@2.5.0: patches/streamdown@2.5.0.patch
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.259'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.259'
  - '@anthropic-ai/claude-agent-sdk@0.3.259'
  - '@openai/codex-sdk@0.153.0'
  - '@openai/codex@0.153.0-darwin-arm64 || 0.153.0-darwin-x64 || 0.153.0-linux-arm64 || 0.153.0-linux-x64 || 0.153.0-win32-arm64 || 0.153.0-win32-x64 || 0.153.0'
